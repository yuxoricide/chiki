<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>yoruchan</title>
    <style>
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
        }
        body { 
            background-color: #000000; 
            color: #ffffff; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            padding: 20px;
        }
        .container { 
            width: 100%; 
            max-width: 800px; 
            text-align: center; 
        }
        .brand {
            font-size: 1.2rem;
            color: #444444;
            text-transform: lowercase;
            letter-spacing: 2px;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 4rem;
            line-height: 1.1;
            margin-bottom: 40px;
            font-weight: 800;
            letter-spacing: -1px;
            
            /* Efecto de brillo texturizado */
            background: linear-gradient(to right, #ffffff 20%, #888888 40%, #ffffff 60%, #ffffff 80%);
            background-size: 200% auto;
            color: transparent;
            -webkit-background-clip: text;
            background-clip: text;
            animation: shine 4s linear infinite;
        }
        
        /* Animación del destello */
        @keyframes shine {
            to {
                background-position: 200% center;
            }
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 2.5rem;
            }
        }
        .embed-container {
            width: 100%;
            background: #111111;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(255, 255, 255, 0.03);
            overflow: hidden;
        }
        iframe {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="brand">yoruchan</div>
        <h1>chikiconi te amoooo</h1>
        <div class="embed-container">
            <iframe style="border-radius: 24px" src="https://untitled.stream/embed/57EuBp2jZh8c" width="100%" height="344" allowFullScreen="" allow="picture-in-picture" frameborder="0" loading="lazy"></iframe>
        </div>
    </div>
</body>
</html>
