<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>yuxoricide</title>
    <style>
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
        }
        body { 
            background-color: #000000; 
            color: #ffffff; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            padding: 20px;
            overflow-x: hidden;
        }
        .container { 
            width: 100%; 
            max-width: 800px; 
            text-align: center; 
        }
        h1 {
            font-size: 4rem;
            line-height: 1.1;
            margin-bottom: 40px;
            font-weight: 800;
            letter-spacing: -1px;
            
            /* Brillo animado plateado */
            background: linear-gradient(to right, #ffffff 20%, #888888 40%, #ffffff 60%, #ffffff 80%);
            background-size: 200% auto;
            color: transparent;
            -webkit-background-clip: text;
            background-clip: text;
            animation: shine 1s linear infinite;
        }
        
        @keyframes shine {
            to {
                background-position: 200% center;
            }
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 2.5rem;
            }
        }

        /* "o" viajando en diagonal, como si las escribieran de esquina a esquina */
        .fly-o {
            display: inline-block;
            animation: diagonal-o 3s ease-in-out infinite;
            animation-delay: var(--delay, 0s);
        }

        @keyframes diagonal-o {
            0% {
                transform: translate(-90vw, -60vh) rotate(0deg);
                opacity: 0;
            }
            15% {
                opacity: 1;
            }
            85% {
                opacity: 1;
            }
            100% {
                transform: translate(90vw, 60vh) rotate(360deg);
                opacity: 0;
            }
        }
        
        .embed-container {
            width: 100%;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(255, 255, 255, 0.02);
            overflow: hidden;
        }
        iframe {
            display: block;
            width: 100%;
            border: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>chikic<span class="fly-o" style="--delay:0s">o</span>ni te am<span class="fly-o" style="--delay:.35s">o</span><span class="fly-o" style="--delay:.70s">o</span><span class="fly-o" style="--delay:1.05s">o</span><span class="fly-o" style="--delay:1.40s">o</span></h1>
        <div class="embed-container">
            <iframe style="border-radius: 24px" src="https://untitled.stream/embed/57EuBp2jZh8c" width="100%" height="344" allowFullScreen="" allow="picture-in-picture" frameborder="0" loading="lazy"></iframe>
        </div>
    </div>
</body>
</html>
